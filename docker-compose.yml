services:
  singularity-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: singularity-bridge
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      # Persistent auto-sandboxes and dynamic channel mappings
      - ./workspaces:/app/workspaces:rw
      - ./data:/app/data:rw
      # Optional/Recommended: Mount host Antigravity CLI and auth credentials into the container
      - ${HOME:-/root}/.gemini:/root/.gemini:rw
      # Optional: Mount additional external projects root if configured
      # - /home/ubuntu/projects:/workspace:rw
    # Headless outbound-only architecture: no inbound ports exposed
