services:
  singularity-bridge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: singularity-bridge
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      # Persistent auto-sandboxes and dynamic channel mappings
      - ./workspaces:/app/workspaces:rw
      - ./data:/app/data:rw
      # Mount host Antigravity CLI and auth credentials into the container
      - ${HOME:-/root}/.gemini:/root/.gemini:rw
      # Modular host projects directory mount (allows mapping any project under this path)
      - ${HOST_PROJECTS_PATH:-/srv/src}:${HOST_PROJECTS_PATH:-/srv/src}:rw
    # Headless outbound-only architecture: no inbound ports exposed
